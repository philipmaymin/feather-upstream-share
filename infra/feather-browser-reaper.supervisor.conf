; Reap only old browser trees created by Feather/Playwright temp profiles.
; The first scan records CPU activity. A browser must be older than 24 hours
; and effectively idle for one hour before the supervised loop terminates it.
[program:feather-browser-reaper]
command=/home/user/.local/share/feather/current/bin/feather-browser-reaper --loop
directory=/home/user/.local/share/feather/current
environment=HOME="/home/user",FEATHER_BROWSER_REAPER_MIN_AGE_SECONDS="86400",FEATHER_BROWSER_REAPER_IDLE_SECONDS="3600",FEATHER_BROWSER_REAPER_INTERVAL_SECONDS="900"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/feather-browser-reaper.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_redirect=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
