<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta id="apple-app-title" name="apple-mobile-web-app-title" content="Feather" />
  <meta id="app-theme-color" name="theme-color" content="#0a0e14" />
  <link id="app-manifest" rel="manifest" href="./manifest.json" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="./icon-180.png" />
  <link id="app-icon" rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>Feather</title>
  <script>
    if (location.hostname === 'app.feather.plus') {
      document.title = 'Fledge'
      document.getElementById('apple-app-title').setAttribute('content', 'Fledge')
      document.getElementById('app-theme-color').setAttribute('content', '#0b1210')
      document.getElementById('app-manifest').setAttribute('href', './fledge-manifest.json')
      document.getElementById('apple-touch-icon').setAttribute('href', './fledge-icon-180.png')
      document.getElementById('app-icon').setAttribute('href', './fledge-icon-192.png')
      document.documentElement.dataset.app = 'fledge'
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/fledge-sw.js', { scope: '/' }).catch(function () {})
        })
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }
    #root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    body {
      background: #0a0e14; color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
  </style>
  <script>
    // iOS PWA keyboard fix — pin the root to the visual viewport so it shrinks with the keyboard
    function syncViewport() {
      var vv = window.visualViewport;
      var h = vv ? vv.height : window.innerHeight;
      var root = document.getElementById('root');
      document.documentElement.style.setProperty('--vh', h * 0.01 + 'px');
      if (root) {
        root.style.height = h + 'px';
        root.style.top = (vv ? vv.offsetTop : 0) + 'px';
      }
      // Prevent iOS from scrolling the body
      window.scrollTo(0, 0);
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', syncViewport);
    // Run after DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', syncViewport);
    } else {
      syncViewport();
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>
</html>
